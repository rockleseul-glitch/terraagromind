}

// ---- Indicateurs supplémentaires, calculés par TERRA uniquement à partir de données vérifiables
function indicatorsHtml(calc, f, results) {
  const d = curDossier; const rows = []; const val = (i, k) => results[i]?.res?.values?.[k]?.value;
  const num2 = (s) => { const n = Number(String(s ?? '').replace(',', '.')); return Number.isFinite(n) && String(s ?? '').trim() !== '' ? n : null; };
  const reg = d?.pa?.superficie != null ? Number(d.pa.superficie) : null;
  if (calc === 'superficies') { const a = val(0, 'area_ha'); if (typeof a === 'number' && reg > 0) { const dp = ((a - reg) / reg) * 100; rows.push(['Écart avec la superficie enregistrée', `${dp >= 0 ? '+' : ''}${fmtNum(Math.round(dp * 10) / 10)} %`, `${fmtNum(Math.round(a * 10000) / 10000)} ha mesurés contre ${fmtNum(reg)} ha enregistrés pour « ${d.pa.nom} ». ${Math.abs(dp) < 0.1 ? 'Concordant avec la fiche de la parcelle.' : 'Corrigez la fiche de la parcelle si votre mesure est plus fiable.'}`]); } }
  if (calc === 'densites') { const pl = val(0, 'plants_ha'); if (typeof pl === 'number' && reg > 0) rows.push(['Plants nécessaires pour la parcelle', `${fmtNum(Math.round(pl * reg))} plants`, `${fmtNum(Math.round(pl))} plants/ha × ${fmtNum(reg)} ha (superficie enregistrée).`]); }
  if (calc === 'rendements' && f.mode !== 'ecart') { const prod = val(0, 'production_kg'); const ha = num2(f.area_ha); if (prod > 0 && ha > 0) rows.push(['Rendement estimé par hectare', `${fmtNum(Math.round(prod / ha))} kg/ha`, `Estimation : ${fmtNum(prod)} kg ÷ ${fmtNum(ha)} ha.`]); }
  if (!rows.length) return '';
  return `<div class="card"><h3>Indicateurs calculés par TERRA</h3>${rows.map(([l, v2, b]) => `<div class="res-row"><span>${esc(l)}</span><div class="res-val"><b>${esc(v2)}</b><br><small>${esc(b)}</small></div></div>`).join('')}<div class="src">Calcul à partir des valeurs ci-dessus ; aucune donnée externe.</div></div>`;
}

async function runLive(form, manual = false) {
  if (!AG || !form?.isConnected) return;
  const seq = ++liveSeq; const calc = form.dataset.calc; const f = formVals(form); const out = $('#calc-out'); if (!out) return;
  let results;
  try { results = AG.runCalc(calc, f); } catch (e) { console.error(e); results = [{ title: 'Calcul', res: { ok: false, errors: [e.message] } }]; }
  const anyOk = results.some((r) => r.res?.ok);
  if (!manual && (!anyOk || missingRequired(form).length)) { out.innerHTML = waitingHtml(form, results); return; }
  lastRun = { calc, results, inputs: f };
  const prev = $('#attach-to')?.value;
  const attach = anyOk ? await attachCard() : '';
  if (seq !== liveSeq || !form.isConnected) return; // un calcul plus récent a pris le relais
  out.innerHTML = `${results.map(resultCard).join('')}${indicatorsHtml(calc, f, results)}${attach}`;
  const sel = $('#attach-to'); if (sel && prev && [...sel.options].some((o) => o.value === prev)) sel.value = prev;
  if (manual) out.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
const liveSchedule = (form, ms = 500) => { clearTimeout(liveTimer); liveTimer = setTimeout(() => { if (form.isConnected) { refreshAssist(form); runLive(form); } }, ms); };

  const sel = opts.length
    ? `<label class="fld"><span>Parcelle du dossier</span><select class="sel" id="dossier-sel"><option value="">Aucun dossier (saisie libre)</option>${opts.map((o) => `<option value="${esc(o.id)}"${o.id === d?.pid ? ' selected' : ''}>${esc(o.l)}</option>`).join('')}</select></label>`

function dossierStrip(d, fx) {
  if (!d) return opts0();
  const E = AG.getEngine(); const chips = []; const alerts = []; const missing = [];
  const cropName = fx.crop ? AG.listCrops().find((c) => c.id === fx.crop.val)?.nom : '';
  if (cropName) chips.push(cropName); else missing.push('culture');
  if (fx.area_ha) chips.push(`${fmtNum(Number(fx.area_ha.val))} ha`); else missing.push('superficie');
  const ref = d.v?.date ?? todayStr();
  if (fx.sowing) {
    chips.push(`Semis ${fmtDate(fx.sowing.val)}`);
    const das = Math.round((new Date(`${ref}T00:00:00`) - new Date(`${fx.sowing.val}T00:00:00`)) / 86400000);
    if (Number.isFinite(das) && das >= 0) chips.push(`J+${das}`);
    if (fx.crop) {
      try {
        const c = E.calendar.checkSowingDate({ crop: fx.crop.val, region: fx.region?.val || undefined, date: fx.sowing.val });
        if (c.ok && c.values?.inWindow?.value === false) alerts.push(`Date de semis hors de la fenêtre de référence${c.values.window ? ` (${fmtMD(c.values.window.from)} → ${fmtMD(c.values.window.to)})` : ''} — à ajuster aux pluies réellement observées.`);
        if (d.v?.stadeId && Number.isFinite(das) && das >= 0) { const s = E.stages.checkDeclared({ crop: fx.crop.val, region: fx.region?.val || undefined, declaredStage: d.v.stadeId, das }); if (s.ok && s.warnings?.length) alerts.push(String(s.warnings[0])); }
      } catch { /* référence indisponible : aucune alerte inventée */ }
    }
  } else missing.push('date de semis');
  if (!fx.region) missing.push('région');
  const late = d.visits.find((x) => x.prochaineVisite && !x.prochaineVisiteFaite && x.prochaineVisite < todayStr());
  if (late) alerts.push(`Visite prévue le ${fmtDate(late.prochaineVisite)} non marquée comme réalisée.`);
  return `<p style="font-size:13px;color:var(--ink-2);margin:8px 0 4px">Rubriques préremplies depuis la ${esc(d.label)}.</p>
    ${chips.length ? `<div class="chips">${chips.map((c) => `<span class="chip ok">${esc(c)}</span>`).join('')}</div>` : ''}
    ${alerts.map((a) => note('warn', 'warn', esc(a))).join('')}
    ${missing.length ? `<p style="font-size:13px;margin:8px 0 0">Données du dossier à compléter : <b>${esc(missing.join(', '))}</b>${d.pid ? ` <button class="mini" type="button" data-go="/activites/parcelles/${esc(d.pid)}/modifier">${ic('edit')}<span>Compléter la parcelle</span>${ic('chev')}</button>` : ''}</p>` : ''}`;
}

  const token = ++renderToken; pendingPrefill = null;

  const p = path.split('/').filter(Boolean);
  let html;
  try {
    if (p.length === 0) html = viewHome();
    else if (p[0] === 'activites') html = await viewActivitesRoute(p, params);
    else if (p[0] === 'conseiller') {
      if (!p[1]) html = await viewConseiller();
      else if (p[1] === 'cat') html = await viewCategory(p[2]);
      else if (p[1] === 'cultures') html = viewCrops();
      else if (p[1] === 'culture') html = viewCrop(p[2], params);
      else if (p[1] === 'references') html = viewReferences();
      else if (p[1] === 'itineraires') html = await viewItineraires(params);
      else if (CALCS[p[1]]) html = await viewCalc(p[1], params);

    } else if (p[0] === 'parametres') html = viewSettings();
    else if (p[0] === 'apropos') html = viewAbout();
    else html = viewHome();
  } catch (err) {
    console.error(err);
    html = page(`<h1>Erreur</h1>${note('err', 'warn', `Une erreur est survenue : ${esc(err.message ?? err)}`)}`);
  }
  if (token !== renderToken || html === '') return; // rendu périmé ou redirection en cours
  if (p[0] === 'conseiller') html = html.replace('<div class="page">', `<div class="page">${ctxBar()}`);
  $('#view').innerHTML = html;
  if (pendingPrefill) { applyPrefill(pendingPrefill); pendingPrefill = null; }
  applyContextRegion();
  const cf = $('#view form[data-calc]'); if (cf && AG) { refreshAssist(cf); runLive(cf); }
  if (p[0] === 'conseiller' && AG && (p[1] === 'cultures' || p[1] === 'culture')) enrichCropScreens(token, p, params);
  if (scrollTop) window.scrollTo(0, 0);
  updateNetPill();
}

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'pays' && t.form?.dataset.form === 'contexte') {
    const cur = readCtxForm(t.form); const before = (ctxDraft ?? CTX).pays;
    ctxDraft = { ...cur, ...(cur.pays !== before ? { region: '', prefecture: '', localite: '', paysAutre: cur.pays === 'AUTRE' ? cur.paysAutre : '' } : {}) };
    render(false); return;
  }
  if (t.form?.dataset.form === 'visite' && t.name) {
    draft[t.name] = t.value;
    if (t.name === 'producteurId') { draft.exploitationId = ''; draft.parcelleId = ''; render(false); }
    else if (t.name === 'exploitationId') { draft.parcelleId = ''; render(false); }
  }
  if (t.id === 'file-restore' && t.files[0]) doRestore(t.files[0], t);
  if (t.id === 'calc-shape') document.querySelectorAll('[data-shapes]').forEach((el) => { el.hidden = !el.dataset.shapes.split(' ').includes(t.value); });
  if (t.id === 'it-crop' || t.id === 'it-region') {
    const c = $('#it-crop').value, r = $('#it-region').value;
    replace(`/conseiller/itineraires?crop=${encodeURIComponent(c)}&region=${encodeURIComponent(r)}`);
  }
});
async function doRestore(file, input) {
  try {
    if (!confirm('Restaurer cette sauvegarde remplace toutes les données actuelles de TERRA sur ce téléphone. Continuer ?')) return;
    await restoreData(file);
    draft = newDraft();
    toast('Sauvegarde restaurée.'); render(false);
  } catch (err) { toast(err.message || 'Restauration impossible.'); }
  finally { input.value = ''; }
}
document.addEventListener('click', (e) => { const r = e.target.closest('[data-replace]'); if (r) replace(r.dataset.replace); });
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act; const form = t.closest('form');
  try {
    if (act === 'step') {
      syncDraft(form);
      const n = Number(t.dataset.n);
      if (n > draft.step) {
        if (draft.step === 1 && !draft.producteurId) { toast('Choisissez le producteur.'); return; }
        if (draft.step === 2 && !draft.date) { toast('Indiquez la date de la visite.'); return; }
        if (draft.step === 1) await prefillFromParcelle();
      }
      draft.step = n; render(true);
    } else if (act === 'reset-draft') { draft = newDraft(); render(false); }
    else if (act === 'visit-for') {
      draft = newDraft({ producteurId: t.dataset.p || '', exploitationId: t.dataset.e || '', parcelleId: t.dataset.pa || '', fromVisit: t.dataset.from || '' });
      await prefillFromParcelle();
      go('/activites/visite');
    } else if (act === 'del') {
      const store = t.dataset.store;
      if (!confirm(DEL_MSG[store] ?? 'Supprimer ?')) return;
      await removeRecord(store, t.dataset.id);
      toast('Supprimé.'); replace(t.dataset.to || '/activites');
    } else if (act === 'geo-detect') {
      if (!navigator.geolocation) { toast('Localisation non disponible sur cet appareil.'); return; }
      ctxDraft = readCtxForm(form); toast('Recherche de la position…');
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        geoSuggest = { lat, lng, ids: COUNTRIES.filter((c) => c.box && lat >= c.box[0] && lat <= c.box[1] && lng >= c.box[2] && lng <= c.box[3]).map((c) => c.id) };
        render(false);
      }, () => toast('Position indisponible. Vérifiez l’autorisation de localisation.'), { enableHighAccuracy: false, timeout: 15000, maximumAge: 0 });
    } else if (act === 'geo-use') {
      const cur = readCtxForm(form); const changed = cur.pays !== t.dataset.id;
      ctxDraft = { ...cur, pays: t.dataset.id, paysAutre: '', ...(changed ? { region: '', prefecture: '', localite: '' } : {}) }; geoSuggest = null; render(false);
    } else if (act === 'ctx-clear') {
      if (!confirm('Effacer le contexte géographique de travail ?')) return;
      await saveContext(form, true);
    } else if (act === 'gps') {
      if (!navigator.geolocation) { toast('Localisation non disponible sur cet appareil.'); return; }
      toast('Recherche de la position…');
      navigator.geolocation.getCurrentPosition((pos) => {
        form.elements.lat.value = pos.coords.latitude.toFixed(6);
        form.elements.lng.value = pos.coords.longitude.toFixed(6);
        toast(`Position relevée (précision environ ${Math.round(pos.coords.accuracy)} m).`);
      }, (err) => toast(`Position indisponible : ${err.message}`), { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
    } else if (act === 'export') { await exportData(); toast('Sauvegarde téléchargée.'); } else if (act === 'pdf-save') { savePdf(); } else if (act === 'pdf-share') { await sharePdf(); }
    else if (act === 'restore') $('#file-restore')?.click();
    else if (act === 'zoom') { const lb = $('#lightbox'); lb.firstElementChild.src = t.src; lb.hidden = false; }
    else if (act === 'rm-draft-photo') { draft.photos = draft.photos.filter((p) => p.id !== t.dataset.pid); render(false); }
    else if (act === 'rm-photo') {
      if (!confirm('Retirer cette photo de la visite ?')) return;
      const v = await dbGet('visites', t.dataset.vid); await dbPut('visites', { ...v, photos: (v.photos ?? []).filter((p) => p.id !== t.dataset.pid), updatedAt: nowIso() }); render(false);
    } else if (act === 'rm-ag') {
      if (!confirm('Retirer ce résultat de conseil de la visite ?')) return;
      const v = await dbGet('visites', t.dataset.vid); await dbPut('visites', { ...v, agromind: (v.agromind ?? []).filter((r) => r.id !== t.dataset.id), updatedAt: nowIso() }); render(false);
    } else if (act === 'attach') {
      const vid = $('#attach-to')?.value; if (!vid || !lastRun) return;
      const v = await dbGet('visites', vid); if (!v) { toast('Visite introuvable.'); return; }
      await dbPut('visites', { ...v, agromind: [...(v.agromind ?? []), snapshot(lastRun.calc, lastRun.results, lastRun.inputs)], updatedAt: nowIso() });
      t.disabled = true; toast('Résultat joint à la visite.');
    }
  } catch (err) { console.error(err); toast(err.message || 'Action impossible.'); }
});
document.body.insertAdjacentHTML('beforeend', '<div id="lightbox" hidden><img alt="Photo agrandie"></div>');
$('#lightbox').addEventListener('click', (e) => { e.currentTarget.hidden = true; });
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'cmp-a' || t.id === 'cmp-b') { replace(`/activites/comparaison?parcelle=${encodeURIComponent(currentRoute().params.get('parcelle') ?? '')}&a=${encodeURIComponent($('#cmp-a').value)}&b=${encodeURIComponent($('#cmp-b').value)}`); return; }
  if (t.id !== 'photo-in') return;
  const vid = t.dataset.visit || ''; const files = [...t.files]; t.value = '';
  try {
    const have = vid ? ((await dbGet('visites', vid))?.photos ?? []).length : draft.photos.length;
    const room = MAX_PHOTOS - have;
    if (room <= 0) { toast(`Maximum ${MAX_PHOTOS} photos par visite.`); return; }
    if (files.length > room) toast(`Seules ${room} photo(s) sur ${files.length} seront ajoutées (maximum ${MAX_PHOTOS}).`); else toast('Compression des photos…');
    const add = []; for (const f of files.slice(0, room)) add.push(await compressImage(f));
    if (vid) { const v = await dbGet('visites', vid); await dbPut('visites', { ...v, photos: [...(v.photos ?? []), ...add], updatedAt: nowIso() }); }
    else draft.photos = [...draft.photos, ...add];
    render(false);
  } catch (err) { console.error(err); toast(err.message || 'Ajout de photo impossible.'); }
});

// ----------------------------------------------------------------------------------------------
// v0.10.0 — événements de l'assistant de rubrique (recalcul automatique, dossier, repères)
// ----------------------------------------------------------------------------------------------
document.addEventListener('input', (e) => {
  const form = e.target.form; if (form?.dataset.form !== 'calc') return;
  userEdit(e.target); liveSchedule(form);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'dossier-sel') { setActiveRef(t.value ? { parcelleId: t.value } : null); replace(currentRoute().path); return; }
  const form = t.form; if (form?.dataset.form !== 'calc') return;
  userEdit(t); liveSchedule(form, 150);
});
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act="hint-apply"]'); if (!t) return;
  const form = $('form[data-calc]'); const el = form?.elements[t.dataset.name]; if (!el?.tagName) return;
  if (el.tagName === 'SELECT' && ![...el.options].some((o) => o.value === t.dataset.val)) { toast('Valeur non disponible dans cette liste.'); return; }
  el.value = t.dataset.val; tagField(el, 'ref', t.dataset.label || ''); liveSchedule(form, 50);
});

if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});

// ----------------------------------------------------------------------------------------------
// Service Worker + mise à jour
// ----------------------------------------------------------------------------------------------
function showUpdateBanner() {
  const b = $('#update'); if (!b) return;
  b.hidden = false;
  b.innerHTML = '<span>Nouvelle version de TERRA installée.</span><button id="btn-reload" type="button">Recharger</button>';
}
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) showUpdateBanner(); updateNetPill(); });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(updateNetPill).catch((err) => console.warn('Service Worker non enregistré', err));
  });
}

// ----------------------------------------------------------------------------------------------
// Démarrage
// ----------------------------------------------------------------------------------------------
depth = history.state?.d ?? 0;
if (history.state?.d === undefined) history.replaceState({ d: 0 }, '', location.href);
ctxReady = loadContext();
enginePromise = loadEngine();
render(true);
