<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TERRA — Assistant de conseil agricole</title>
  <meta name="description" content="TERRA : assistant de conseil agricole hors connexion, propulsé par le moteur AGROMIND.">
  <meta name="theme-color" content="#0f3d22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TERRA">

  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
/* TERRA v0.4.0 — feuille de style (aucune police ni ressource distante : 100 % hors connexion) */
:root{
  --green:#1f7a3a; --green-2:#2e9e4f; --green-dark:#0f3d22; --green-mid:#1b5e3a;
  --ink:#16251b; --ink-2:#4a5b4f; --line:#dbe5d9; --bg:#eef3ec; --card:#ffffff;
  --gold:#e8b223; --earth:#b5651d; --warn-bg:#fff6dd; --warn-ink:#6b4a00;
  --ok-bg:#e3f4e8; --ok-ink:#14602c; --grey-bg:#eef0ee; --grey-ink:#55625a;
  --radius:20px; --shadow:0 6px 18px rgba(15,61,34,.12);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --font:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit}
a{color:var(--green)}
svg.ic{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{min-height:100%;display:flex;flex-direction:column}
#view{flex:1;display:flex;flex-direction:column;min-height:0}
[hidden]{display:none!important}

/* Bannière de mise à jour */
.banner{background:var(--green-dark);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px}
.banner button{background:var(--gold);color:#2b2000;border:0;border-radius:999px;padding:8px 14px;font-weight:700}

/* ===== Accueil (aucun défilement) ===== */
.home{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.home-head{background:linear-gradient(160deg,var(--green-dark),var(--green-mid));color:#fff;padding:calc(14px + var(--sat)) 18px 18px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:14px;position:relative;box-shadow:var(--shadow)}
.home-head img{width:64px;height:64px;flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.home-head h1{margin:0;font-size:30px;letter-spacing:.14em;font-weight:800;line-height:1}
.home-head p{margin:5px 0 0;font-size:14px;opacity:.9}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-size:11.5px;color:#fff;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa79e}
.dot.ok{background:#5be584}.dot.off{background:var(--gold)}.dot.bad{background:#ff8a7a}
.home-cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:16px 16px 6px}
.big{flex:1;min-height:0;border:0;border-radius:26px;text-align:left;color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.big:active{transform:scale(.985)}
.big.a{background:linear-gradient(145deg,var(--green-2),var(--green) 55%,#165c2c)}
.big.b{background:linear-gradient(145deg,#1d5a3a,var(--green-dark) 70%)}
.big .badge-ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.big .badge-ic svg{width:30px;height:30px}
.big h2{margin:4px 0 0;font-size:21px;letter-spacing:.06em;font-weight:800}
.big p{margin:0;font-size:14px;opacity:.92;max-width:calc(100% - 56px)}
.big .ghost{position:absolute;right:-20px;top:-24px;width:140px;height:140px;opacity:.12;stroke-width:1.5}
.big .go{position:absolute;right:16px;bottom:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.big.b .go{background:var(--gold);color:#2b2000}
.home-foot{padding:6px 16px calc(10px + var(--sab));text-align:center;font-size:12.5px;color:var(--ink-2)}
.home-foot button{background:none;border:0;color:var(--green);font-weight:600;padding:6px 8px;text-decoration:underline}
@media (max-height:600px){.big p{display:none}.big .badge-ic{width:42px;height:42px}.home-head img{width:52px;height:52px}.home-head h1{font-size:26px}}

/* ===== Écrans internes ===== */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--sat)) 14px 10px;display:flex;gap:10px;border-bottom:1px solid var(--line)}
.nav{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;font-weight:800;letter-spacing:.04em;font-size:14px;cursor:pointer;text-transform:uppercase}
.nav.back{background:#fff;border:2px solid var(--green);color:var(--green)}
.nav.home-btn{background:var(--green);border:2px solid var(--green);color:#fff}
.nav:active{filter:brightness(.93)}
.page{padding:16px 16px calc(28px + var(--sab));display:flex;flex-direction:column;gap:14px;max-width:720px;width:100%;margin:0 auto}
.page h1{margin:2px 0 0;font-size:24px;line-height:1.15;color:var(--green-dark)}
.lead{margin:0;color:var(--ink-2);font-size:15px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}

.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;width:100%;cursor:pointer;box-shadow:0 2px 8px rgba(15,61,34,.05)}
.row:active{background:#f6faf5}
.row .ico{width:48px;height:48px;border-radius:14px;background:var(--ok-bg);color:var(--green);display:grid;place-items:center;flex:none}
.row .ico svg{width:26px;height:26px}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:16.5px;color:var(--ink)}
.row .txt span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.row .chev{color:#9bb09f}
.row.static{cursor:default}.row.static:active{background:var(--card)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chip.plan{background:var(--warn-bg);color:var(--warn-ink)}
.chip.grey{background:var(--grey-bg);color:var(--grey-ink)}
.chip.bad{background:#fde6e2;color:#8a2417}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.note{border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.info{background:var(--ok-bg);color:var(--ok-ink)}
.note.err{background:#fde6e2;color:#8a2417}
.note svg{margin-top:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--green-dark)}
.card p{margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:600;text-align:right;word-break:break-word}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
ul.plain li svg{margin-top:2px;color:var(--green)}
ul.plain li.off{color:var(--ink-2)}ul.plain li.off svg{color:#a9b5ac}

.search{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:0 14px;min-height:50px}
.search:focus-within{border-color:var(--green)}
.search input{flex:1;border:0;outline:0;font:inherit;background:transparent;min-height:46px;min-width:0}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.f.on{background:var(--green);border-color:var(--green);color:#fff}
select.sel{width:100%;min-height:48px;border:2px solid var(--line);border-radius:14px;padding:0 12px;font:inherit;background:#fff;color:var(--ink)}
.progress{height:10px;border-radius:99px;background:#e1eadf;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--green));border-radius:99px}
dl.tech{margin:0;display:flex;flex-direction:column;gap:10px}
dl.tech dt{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--green)}
dl.tech dd{margin:2px 0 0;font-size:14.5px}
.src{font-size:12.5px;color:var(--ink-2);border-left:3px solid var(--gold);padding-left:10px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--green);color:#fff;border:0;font-weight:800;cursor:pointer;text-decoration:none}
.btn.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
.empty{text-align:center;color:var(--ink-2);padding:22px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v0.2.0 : formulaires et espace Mes activités ===== */
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:700;color:var(--green-dark)}
.fld input,.fld textarea{width:100%;min-height:48px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
.fld textarea{resize:vertical;min-height:84px}
.fld input:focus,.fld textarea:focus,select.sel:focus{outline:0;border-color:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn{flex:1;min-width:130px}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px}
.btn.danger{background:#fff;color:#a32a19;border:2px solid #e6b2aa}
.btn:disabled{opacity:.5}
.mini{display:flex;align-items:center;gap:10px;width:100%;background:var(--grey-bg);border:0;border-radius:12px;padding:10px 12px;margin:6px 0;text-align:left;font-size:14.5px;cursor:pointer}
.mini span{flex:1;min-width:0}.mini svg:last-child{color:#9bb09f}
h3.sub{margin:6px 0 0;font-size:15px;color:var(--green-dark)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:#e1eadf;color:var(--ink-2)}
.stepper i.on{background:var(--green);color:#fff}.stepper i.done{background:var(--green-dark);color:#fff}
.stepper b{flex:1;height:3px;background:#d3dfd1;border-radius:3px}
#toast{position:fixed;left:50%;bottom:calc(22px + var(--sab));transform:translate(-50%,20px);max-width:90%;background:var(--green-dark);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== v0.3.0 : résultats de calcul ===== */
.res-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.res-row:first-of-type{border-top:0}
.res-val{text-align:right;max-width:62%;word-break:break-word}
.res-val div{text-align:left}
.res-val small{color:var(--ink-2);font-size:12px}
.res-val .chip{margin-top:3px}

/* ===== v0.4.0 ===== */
.sub-item{background:var(--grey-bg);border-radius:12px;padding:8px 10px;margin:6px 0}
.kvline{margin:3px 0;font-size:14px}.kvline>span{font-weight:700;color:var(--green-dark);margin-right:6px}
.res-block{padding:8px 0;border-top:1px solid var(--line)}.res-block h4{margin:0 0 4px}
h4{margin:10px 0 2px;font-size:14px;color:var(--green-dark)}
ul.bul{margin:4px 0 8px;padding-left:20px;font-size:14px}ul.bul li{margin:3px 0}
fieldset.chk{border:2px solid var(--line);border-radius:14px;padding:6px 12px 10px;margin:0}
fieldset.chk legend{font-weight:700;color:var(--green-dark);font-size:13px;padding:0 6px}
.chk-item{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14.5px}
.chk-item input{width:22px;height:22px;flex:none;accent-color:var(--green)}

/* ===== v0.4.1 : accueil plein écran (photo) ===== */
.home.hero{position:relative;height:100vh;height:100dvh;overflow:hidden;background:#0c3a1d;color:#fff}
.hero-bg{position:absolute;left:0;top:calc(var(--sat) + 52px);width:100%;height:calc(82% - var(--sat) - 52px);object-fit:cover;object-position:36% 28%;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 13%,#000 68%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 13%,#000 68%,transparent 100%)}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,40,20,.0) 0%,rgba(8,40,20,0) 60%,rgba(8,40,20,.55) 100%)}
.hero-top{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:calc(14px + var(--sat)) 18px 0}
.hero-logo{width:84px;height:84px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.hero-tag{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hero .pill{background:rgba(0,0,0,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);margin-top:8px}
.hero-cards{position:absolute;left:0;right:0;bottom:calc(44px + var(--sab));z-index:2;display:flex;flex-direction:column;gap:12px;padding:0 16px}
.glass{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;color:#fff;
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.62);border-radius:22px;padding:14px 16px;
  backdrop-filter:blur(7px) saturate(1.25);-webkit-backdrop-filter:blur(7px) saturate(1.25);box-shadow:0 6px 22px rgba(0,0,0,.28);transition:transform .12s,background .12s}
.glass:active{transform:scale(.98);background:rgba(255,255,255,.24)}
.g-ic{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12)}
.g-ic svg{width:24px;height:24px}
.g-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 6px rgba(0,0,0,.65)}
.g-txt b{font-size:16px;letter-spacing:.04em;font-weight:800;white-space:nowrap}
.g-txt small{font-size:13px;opacity:.95;line-height:1.25}
.g-go{opacity:.9}.g-go svg{width:22px;height:22px}
.hero-foot{position:absolute;left:0;right:0;bottom:0;z-index:2;text-align:center;font-size:12.5px;color:rgba(255,255,255,.88);padding:6px 16px calc(10px + var(--sab));text-shadow:0 1px 4px rgba(0,0,0,.7)}
.hero-foot button{background:none;border:0;color:#fff;font-weight:600;padding:6px 8px;text-decoration:underline}
@media (max-height:620px){.g-txt small{display:none}.hero-logo{width:64px;height:64px}.glass{padding:10px 14px}}
@media (min-width:700px){.hero-bg{object-position:center 25%}.hero-cards{max-width:560px;left:50%;transform:translateX(-50%);width:100%}}

  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.gal figure{position:relative;margin:0}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;cursor:pointer}
  .gal .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1;cursor:pointer}
  #lightbox{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}#lightbox[hidden]{display:none}#lightbox img{max-width:100%;max-height:100%}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp p{white-space:pre-wrap;font-size:13.5px;margin:2px 0 6px}
  
/* Contexte géographique (v0.7.0) */
.ctx{padding:10px 12px}
.ctx-row{display:flex;align-items:center;gap:10px}
.ctx-ic{color:var(--green);display:flex}
.ctx-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.ctx-txt small{font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.ctx-txt b{font-size:14.5px;word-break:break-word}
.ctx-btn{background:var(--grey-bg);border:0;border-radius:999px;padding:8px 14px;font-weight:700;color:var(--green)}
.ctx-note{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.ctx-note.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:8px 10px}
  .prov{display:block;font-size:11.5px;font-weight:700;margin-top:2px;line-height:1.3}.prov-obs{color:#1f7a3d}.prov-calc{color:#1d5fa8}.prov-est{color:#9a5b00}.prov-ref{color:#5b3d99}.prov-user{color:#5c6b60}
  .fld.pre input,.fld.pre select,.fld.pre textarea{border-color:#9fd3ae}
  .hintcard{border-left:5px solid #5b3d99;background:#faf8ff}.dossier{border-left:5px solid var(--green)}.dossier h3 svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
  .top-logo{flex:none;width:48px;height:48px;padding:0;border:0;background:none;border-radius:12px;cursor:pointer;align-self:center}.top-logo img{display:block;width:48px;height:48px;border-radius:12px}
  .pdfprev .prev-nav{display:flex;align-items:center;gap:8px;margin:8px 0}.pdfprev .prev-nav .btn{flex:1;min-width:0;white-space:nowrap;padding-left:8px;padding-right:8px}.pdfprev .prev-n{flex:none;font-size:13px;color:var(--green-dark)}.pdfprev .prev-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:70vh}.pdfprev .prev-wrap canvas{display:block;width:100%;cursor:zoom-in}.pdfprev .prev-wrap.big canvas{width:220%;cursor:zoom-out}
</style>
</head>

// État d'une fonction : le moteur expose-t-il réellement les fonctions annoncées ?
function probe(fn) {
  const checks = fn.uses.map((path) => ({ path, present: hasFunction(path) }));
  return { checks, engineReady: checks.every((c) => c.present) };
}

function listCrops({ query = '', category = '' } = {}) {
  const a = init();
  const base = query.trim() ? a.crops.search(query) : a.crops.list(category || undefined);
  return base.filter((c) => !category || c.categories.includes(category));
}

// Aperçu non interprété d'une valeur du référentiel (aucune valeur n'est reformulée ni complétée).
function preview(value, unit) {
  const u = unit ? ` ${unit}` : '';
  if (value === null || value === undefined) return '—';
  if (typeof value === 'number') return `${value}${u}`;
  if (typeof value === 'string') return value.length > 110 ? `${value.slice(0, 107)}…` : value;
  if (Array.isArray(value)) {
    if (value.length === 2 && value.every((x) => typeof x === 'number')) return `${value[0]}–${value[1]}${u}`;
    if (value.every((x) => typeof x === 'string')) return value.length > 3 ? `${value.slice(0, 3).join(', ')}… (${value.length})` : value.join(', ');
    return `${value.length} élément(s)`;
  }
  if (typeof value === 'object') return `${Object.keys(value).length} rubrique(s) documentée(s)`;
  return String(value);
}

function cropSheet(id, region) {
  const a = init();
  const f = a.crops.fiche(id, region || undefined);
  if (!f.ok) return { ok: false, errors: f.errors };
  const filled = [];
  const absent = [];
  for (const [field, d] of Object.entries(f.values.champs)) {
    const label = FIELD_LABELS[field] ?? field;
    if (d.value === null || d.value === undefined) { absent.push({ field, label }); continue; }
    const p = d.provenance ?? {};
    filled.push({ field, label, preview: preview(d.value, d.unit), source: p.source ?? null, document: p.document ?? null, year: p.year ?? null, validation: p.validation ?? 'non_verifie', limits: p.limits ?? null });
  }
  const t = a.crops.techniques(id, region || undefined);
  const techniques = t.ok ? t.values.techniques : [];
  return { ok: true, identity: f.values.identite, completude: f.completude, filled, absent, techniques };
}

const num = (s) => { if (s === undefined || s === null || String(s).trim() === '') return undefined; const n = Number(String(s).replace(',', '.')); return Number.isFinite(n) ? n : NaN; };
const pct = (s) => { const n = num(s); return n === undefined || Number.isNaN(n) ? n : n / 100; };
const compact = (o) => Object.fromEntries(Object.entries(o).filter(([, x]) => x !== undefined));
const bad = (module, msg) => ({ ok: false, module, errors: [msg], warnings: [], missing: [], notes: [] });
const hasNaN = (o) => Object.entries(o).find(([, x]) => typeof x === 'number' && Number.isNaN(x))?.[0];

// Exécute un calcul : renvoie une liste de sections { title, res } où res est le résultat BRUT du moteur.
function runCalc(id, f) {
  const a = init();
  try {
    if (id === 'superficies') {
      const keys = { rectangle: ['length', 'width'], square: ['side'], triangle: ['base', 'height', 'sideA', 'sideB'], circle: ['radius'], trapezoid: ['baseA', 'baseB', 'height'] }[f.shape] ?? [];
      const plot = compact({ shape: f.shape, unit: 'm', ...Object.fromEntries(keys.map((k) => [k, num(f[k])])) });
      const nan = hasNaN(plot); if (nan) return [{ title: 'Superficie', res: bad('geometry', `${nan} : valeur non numérique`) }];
      return [{ title: 'Superficie et périmètre', res: a.geometry.area(plot) }];
    }
    if (id === 'densites') {
      const d = compact({ rowSpacing_cm: num(f.rowSpacing), inRowSpacing_cm: num(f.inRowSpacing), plantsPerHole: num(f.plantsPerHole) });
      const nan = hasNaN(d); if (nan) return [{ title: 'Densité', res: bad('seeds', `${nan} : valeur non numérique`) }];
      const out = [{ title: 'Densité de plantation', res: a.seeds.density(d) }];
      if (num(f.length) !== undefined || num(f.width) !== undefined) {
        const l = compact({ length_m: num(f.length), width_m: num(f.width), rowSpacing_cm: d.rowSpacing_cm, inRowSpacing_cm: d.inRowSpacing_cm, edgeMargin_m: num(f.edge), rowsAlong: f.rowsAlong || undefined });
        const n2 = hasNaN(l); out.push({ title: 'Lignes et poquets dans la parcelle (rectangle)', res: n2 ? bad('geometry', `${n2} : valeur non numérique`) : a.geometry.layout(l) });
      }
      return out;
    }
    if (id === 'semences-ref') {
      const area = num(f.area_ha);
      return [{ title: 'Taux de semences du référentiel', res: a.seeds.recommendedRate({ crop: f.crop, region: f.region || undefined, area_ha: area === undefined ? 1 : area }) }];
    }
    if (id === 'semences-plan') {
      const p = compact({ area_ha: num(f.area_ha), rowSpacing_cm: num(f.rowSpacing), inRowSpacing_cm: num(f.inRowSpacing), seedsPerHole: num(f.seedsPerHole), plantsKeptPerHole: num(f.plantsKept),
        germinationRate: pct(f.germination), fieldEmergenceRate: pct(f.emergence), thousandSeedWeight_g: num(f.tsw), safetyMargin: pct(f.margin) });
      const nan = hasNaN(p); if (nan) return [{ title: 'Plan de semis', res: bad('seeds', `${nan} : valeur non numérique`) }];
      return [{ title: 'Plan de semis', res: a.seeds.plan(p) }];
    }
    if (id === 'stades') {
      const region = f.region || undefined;
      const r1 = a.stages.currentStage({ crop: f.crop, region, sowingDate: f.sowingDate, today: f.today });
      const out = [{ title: 'Stade attendu d’après la date de semis', res: r1 }];
      if (f.declaredStage && r1.ok && r1.values.das) out.push({ title: 'Cohérence avec le stade observé', res: a.stages.checkDeclared({ crop: f.crop, region, declaredStage: f.declaredStage, das: r1.values.das.value }) });
      return out;
    }
    if (id === 'calendriers') {
      const region = f.region || undefined;
      const out = [{ title: 'Fenêtres et opérations de référence', res: a.calendar.windows({ crop: f.crop, region }) }];
      if (f.sowingDate) {
        out.push({ title: 'Date de semis envisagée', res: a.calendar.checkSowingDate({ crop: f.crop, region, date: f.sowingDate }) });
        out.push({ title: 'Calendrier daté à partir du semis', res: a.calendar.plan({ crop: f.crop, region, sowingDate: f.sowingDate }) });
      }
      return out;
    }
  } catch (e) { return [{ title: 'Calcul', res: bad('terra', e.message) }]; }
  return runCalc2(id, f) ?? [{ title: 'Calcul', res: bad('terra', 'Calcul inconnu.') }];
}

// v0.4.0 — autres fonctions agronomiques (fertilisation, eau, protection, diagnostic, rendements, économie, conseil…)
// ---------------------------------------------------------------------------------------------
const diagnosisForm = () => init().diagnosis.observationForm();
const diagnosisSymptoms = () => init().diagnosis.symptoms;
const okv = (module, values, extra = {}) => ({ ok: true, module, values, warnings: [], missing: [], notes: [], ...extra });
const DOSE_UNITS = ['kg/ha', 't/ha', 'g/m2', 'kg/m2', 'g/plant'];
const costCats = () => init().economics.categories;

function runCalc2(id, f) {
  const a = init();
  const region = f.region || undefined;
  const nanOf = (o) => hasNaN(o);
  const guard = (module, o) => { const k = nanOf(o); return k ? bad(module, `${k} : valeur non numérique`) : null; };
  try {
    if (id === 'associations') {
      if (f.mode === 'ler') {
        const comp = [1, 2].map((i) => compact({ crop: f[`l${i}name`] || `Culture ${i}`, yieldInter: num(f[`l${i}i`]), yieldSole: num(f[`l${i}s`]) }));
        const g = guard('intercropping', Object.assign({}, ...comp)); if (g) return [{ title: 'LER', res: g }];
        return [{ title: 'Land Equivalent Ratio (LER)', res: a.intercropping.LER({ components: comp }) }];
      }
      const crops = [f.c1, f.c2, f.c3].filter(Boolean);
      return [{ title: 'Analyse de l’association', res: a.intercropping.analyze({ crops, region }) }];
    }
    if (id === 'rotations') {
      const sequence = [f.r1, f.r2, f.r3, f.r4].filter(Boolean);
      const out = [{ title: 'Analyse de la rotation', res: a.rotation.analyzeRotation({ sequence, cyclic: f.cyclic === 'on', region }) }];
      if (sequence[0]) out.push({ title: `Rotations documentées après/avec ${sequence[0]}`, res: a.rotation.recommendations({ crop: sequence[0], region }) });
      return out;
    }
    if (id === 'fertilisation') {
      if (f.mode === 'programme') return [{ title: 'Programme de fertilisation du référentiel', res: a.fertilization.recommendedProgram({ crop: f.p_crop, region, system: f.p_system || undefined, varietyGroup: f.p_group || undefined }) }];
      if (f.mode === 'dose') {
        const o = compact({ dose_kg_ha: num(f.d_dose), area_ha: num(f.d_area), density: num(f.d_density) }); const g = guard('fertilization', o); if (g) return [{ title: 'Dose', res: g }];
        const out = [{ title: 'Quantité pour la parcelle', res: a.fertilization.plotDose({ dose_kg_ha: o.dose_kg_ha, area_m2: o.area_ha * 10000 }) }];
        if (o.density) out.push({ title: 'Dose par plant', res: a.fertilization.perPlant({ dose_kg_ha: o.dose_kg_ha, density_plants_ha: o.density }) });
        return out;
      }
      if (f.mode === 'elements') {
        const o = compact({ quantity: num(f.e_qty) }); const g = guard('fertilization', o); if (g) return [{ title: 'Éléments', res: g }];
        return [{ title: 'Éléments nutritifs apportés', res: a.fertilization.nutrients({ product: (f.e_product || '').trim(), quantity: o.quantity, unit: 'kg' }) }];
      }
      const fractions = [1, 2, 3].map((i) => ({ stage: (f[`s_stage${i}`] || '').trim(), fraction: pct(f[`s_frac${i}`]) })).filter((x) => x.stage && x.fraction !== undefined);
      const t = num(f.s_total); if (t === undefined || Number.isNaN(t)) return [{ title: 'Fractionnement', res: bad('fertilization', 'Dose totale (kg/ha) requise') }];
      return [{ title: 'Fractionnement de la dose', res: a.fertilization.split({ total_kg_ha: t, fractions }) }];
    }
    if (id === 'eau') {
      if (f.mode === 'mm') { const o = compact({ depth_mm: num(f.depth), area_m2: num(f.area_m2) }); return [{ title: 'Hauteur d’eau → volume', res: guard('water', o) ?? a.water.mmToVolume(o) }]; }
      if (f.mode === 'vol') { const o = compact({ volume_m3: num(f.volume), area_m2: num(f.area_m2b) }); return [{ title: 'Volume → hauteur d’eau', res: guard('water', o) ?? a.water.volumeToMm(o) }]; }
      if (f.mode === 'bilan') { const o = compact({ theoretical_m3: num(f.theo), applied_m3: num(f.appl) }); return [{ title: 'Bilan volume apporté / besoin théorique', res: guard('water', o) ?? a.water.balance(o) }]; }
      const o = compact({ requirement_mm: num(f.req), supply_mm: num(f.sup) }); return [{ title: 'Contrainte hydrique', res: guard('water', o) ?? a.water.hydricConstraint(o) }];
    }
    if (id === 'phyto') {
      const out = [{ title: 'Mesures de protection intégrée', res: a.phyto.measures({ category: f.category, crop: f.crop || undefined }) }];
      const target = (f.target || '').trim();
      if (f.crop && target) out.push({ title: 'Produits homologués documentés', res: a.phyto.chemical({ crop: f.crop, target, country: 'TG', applicationDate: f.appDate || undefined, harvestDate: f.harvDate || undefined }) });
      else out.push({ title: 'Produits homologués documentés', res: okv('phyto', {}, { notes: ['Indiquez la culture et la cible précise (ravageur ou maladie, telle que nommée dans le référentiel) pour interroger les produits documentés. Aucun produit n’est proposé sans homologation vérifiée.'] }) });
      return out;
    }
    if (id === 'diagnostic') {
      const obs = compact({ crop: f.crop || undefined, stage: f.stage || undefined, organs: f.organs?.length ? f.organs : undefined, symptoms: f.symptoms ?? [], distribution: f.distribution || undefined, evolution: f.evolution || undefined, humidity: f.humidity || undefined, temperature: f.temperature || undefined, recentInputs: f.recentInputs?.length ? f.recentInputs : undefined });
      return [{ title: 'Hypothèses de diagnostic', kind: 'diag', res: a.diagnosis.diagnose(obs) }];
    }
    if (id === 'calculs') {
      const val = num(f.value); if (val === undefined || Number.isNaN(val)) return [{ title: 'Conversion', res: bad('units', 'Valeur numérique requise') }];
      const from = f.from, to = f.to;
      if (DOSE_UNITS.includes(from) || DOSE_UNITS.includes(to)) return [{ title: 'Conversion de dose', res: a.fertilization.convertDose({ value: val, from, to, density_plants_ha: num(f.density) }) }];
      if (from === 'sac' || to === 'sac') return [{ title: 'Conversion de masse', res: a.yield.convertMass({ value: val, from, to, sackWeight_kg: num(f.sack) }) }];
      try { return [{ title: 'Conversion', res: okv('units', { value: { value: a.units.convert(val, from, to), unit: to, kind: 'resultat_de_calcul' } }) }]; }
      catch (e) { return [{ title: 'Conversion', res: bad('units', e.message) }]; }
    }
    if (id === 'rendements') {
      if (f.mode === 'ecart') { const o = compact({ expected_kg: num(f.exp), actual_kg: num(f.act), area_ha: num(f.area2) }); return [{ title: 'Écart entre rendement attendu et réel', res: guard('yield', o) ?? a.yield.compare(o) }]; }
      const o = compact({ crop: f.crop || undefined, region, variety: (f.variety || '').trim() || undefined, area_ha: num(f.area_ha), density_plants_ha: num(f.density), survivalRate: pct(f.survival), yieldPerPlant_kg: num(f.ypp), yieldPerHa_kg: num(f.yph), lossRate: pct(f.loss) });
      const g = guard('yield', o); if (g) return [{ title: 'Estimation', res: g }];
      const out = [{ title: 'Estimation de production', res: a.yield.estimate(o) }];
      if (o.crop) out.push({ title: 'Repères de rendement documentés', res: a.yield.benchmarks({ crop: o.crop, region }) });
      return out;
    }
    if (id === 'economie') {
      const items = costCats().map((c) => ({ label: c, category: c, amount_FCFA: num(f[`c_${c}`]), origin: f.cost_origin })).filter((x) => x.amount_FCFA !== undefined);
      const o = compact({ area_ha: num(f.area_ha), production_kg: num(f.prod), price_FCFA_per_kg: num(f.price), lossRate: pct(f.loss) });
      const g = guard('economics', { ...o, ...Object.fromEntries(items.map((x) => [x.category, x.amount_FCFA])) }); if (g) return [{ title: 'Économie', res: g }];
      return [{ title: 'Coûts, marge et seuil de rentabilité', res: a.economics.margins({ items, ...o, production_origin: f.prod_origin, price_origin: f.price_origin }) }];
    }
    if (id === 'suivi-cultures') {
      const r1 = a.stages.currentStage({ crop: f.crop, region, sowingDate: f.sowingDate, today: f.today });

      return [{ title: 'Conseil agronomique global', kind: 'advice', res: a.advise(o) }];
    }
  } catch (e) { console.error(e); return [{ title: 'Calcul', res: bad('terra', e.message) }]; }
  return null;
}

const STORES = ['producteurs', 'exploitations', 'parcelles', 'visites']; // données métier
const ALL_STORES = [...STORES, 'reglages']; // + réglages (contexte géographique), ajouté en v0.7.0
let dbp = null;
function openDB() {
  if (!dbp) {
    dbp = new Promise((res, rej) => {
      if (!window.indexedDB) { rej(new Error('Le stockage local (IndexedDB) n’est pas disponible sur ce navigateur.')); return; }
      const r = indexedDB.open('terra-db', 2);
      r.onupgradeneeded = () => { const d = r.result; ALL_STORES.forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
      r.onsuccess = () => { r.result.onversionchange = () => r.result.close(); res(r.result); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => console.warn('TERRA : fermez les autres onglets de TERRA pour finaliser la mise à jour des données.');
    });
  }
  return dbp;
}
async function tx(store, mode, fn) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const dbAll = (s) => tx(s, 'readonly', (o) => o.getAll());
const dbGet = (s, id) => tx(s, 'readonly', (o) => o.get(id));
const dbPut = (s, v) => tx(s, 'readwrite', (o) => o.put(v));
const dbDel = (s, id) => tx(s, 'readwrite', (o) => o.delete(id));

};

// Sauvegarde / restauration (fichier JSON)
async function exportData() {
  const data = {};
  for (const s of ALL_STORES) data[s] = await dbAll(s);
  const blob = new Blob([JSON.stringify({ app: 'TERRA', version: APP_VERSION, exportedAt: nowIso(), data }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `terra-sauvegarde-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function restoreData(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch { throw new Error('Fichier illisible.'); }
  if (j?.app !== 'TERRA' || typeof j.data !== 'object' || !j.data) throw new Error('Ce fichier n’est pas une sauvegarde TERRA.');
  for (const s of ALL_STORES) if (j.data[s] !== undefined && !Array.isArray(j.data[s])) throw new Error('Sauvegarde corrompue.');
  const d = await openDB();
  await new Promise((res, rej) => {
    const t = d.transaction(ALL_STORES, 'readwrite');
    for (const s of ALL_STORES) { if (s === 'reglages' && j.data[s] === undefined) continue; const o = t.objectStore(s); o.clear(); (j.data[s] ?? []).forEach((v) => { if (v && v.id) o.put(v); }); }
    t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  await loadContext();
}

// Suppression (avec cascade producteur → exploitations → parcelles ; les visites sont conservées dans l'historique)

  if (store === 'producteurs') for (const e of (await dbAll('exploitations')).filter((x) => x.producteurId === id)) await removeRecord('exploitations', e.id);
  if (store === 'exploitations') for (const x of (await dbAll('parcelles')).filter((p) => p.exploitationId === id)) await dbDel('parcelles', x.id);
  await dbDel(store, id);
}

// Enregistrement des formulaires producteur / exploitation / parcelle
async function saveForm(form) {
  const kind = form.dataset.form; const id = form.dataset.id || '';
  const f = Object.fromEntries(new FormData(form).entries());
  for (const k of Object.keys(f)) if (typeof f[k] === 'string') f[k] = f[k].trim();
  const store = { producteur: 'producteurs', exploitation: 'exploitations', parcelle: 'parcelles' }[kind];
  const old = id ? await dbGet(store, id) : null;
  const rec = { ...(old ?? {}), ...f, id: old?.id ?? uid(), createdAt: old?.createdAt ?? nowIso(), updatedAt: nowIso() };
  if (kind === 'parcelle') {
    const num = (v) => (v === '' || v == null ? null : Number(String(v).replace(',', '.')));
    rec.superficie = num(f.superficie);
    if (rec.superficie !== null && !(rec.superficie >= 0)) throw new Error('Superficie invalide.');
    rec.lat = num(f.lat); rec.lng = num(f.lng);
    if ((rec.lat !== null && !(Math.abs(rec.lat) <= 90)) || (rec.lng !== null && !(Math.abs(rec.lng) <= 180))) throw new Error('Coordonnées GPS invalides.');
    rec.cultureId = matchCropId(rec.cultureNom);
  }
  await dbPut(store, rec);
  toast('Enregistré sur ce téléphone.');
  replace(kind === 'producteur' ? `/activites/producteurs/${rec.id}` : kind === 'exploitation' ? `/activites/exploitations/${rec.id}` : `/activites/parcelles/${rec.id}`);
}

function compressImage(file, max = 1280, q = 0.7) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res({ id: uid(), dataUrl: c.toDataURL('image/jpeg', q), w, h, at: nowIso() });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Photo illisible.')); };
    img.src = url;
  });
}

async function stageCheck(form) {

  if (!f.dateSemis || !f.stadeId) throw new Error('Indiquez la date de semis et le stade observé.');
  const results = AG.runCalc('stades', { crop: v.cultureId, region: f.region || '', sowingDate: f.dateSemis, today: v.date, declaredStage: f.stadeId });

async function viewComparaison(q) {
  const pid = q.get('parcelle') || '';
  const pa = pid ? await dbGet('parcelles', pid) : null; if (!pa) return notFound('Parcelle');
  const vs = (await dbAll('visites')).filter((v) => v.parcelleId === pid).sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.createdAt).localeCompare(String(b.createdAt)));
  const head = `<span class="eyebrow">${esc(pa.nom)}</span><h1>Comparer les visites</h1>`;
  if (vs.length < 2) return page(`${head}${note('warn', 'info', 'Il faut au moins deux visites de cette parcelle pour les comparer.')}`);
  const A = vs.find((v) => v.id === q.get('a')) ?? vs[vs.length - 2];
  const B = vs.find((v) => v.id === q.get('b')) ?? vs[vs.length - 1];
  const opts = (sel) => vs.map((v) => `<option value="${esc(v.id)}"${v.id === sel.id ? ' selected' : ''}>${esc(fmtDate(v.date))}</option>`).join('');
  const days = Math.round((new Date(`${B.date}T00:00:00`) - new Date(`${A.date}T00:00:00`)) / 86400000);
  const row = (t, k) => {
    if (!A[k] && !B[k]) return '';
    const same = String(A[k] ?? '').trim() === String(B[k] ?? '').trim();
    return `<div class="card"><h3>${t} <span class="chip ${same ? 'grey' : 'plan'}">${same ? 'Texte identique' : 'Texte différent'}</span></h3>
      <div class="cmp"><div><small>${esc(fmtDate(A.date))}</small><p>${esc(A[k]) || '—'}</p></div><div><small>${esc(fmtDate(B.date))}</small><p>${esc(B[k]) || '—'}</p></div></div></div>`;
  };
  const titles = (v) => (v.agromind ?? []).map((r) => r.titre).join(', ') || '—';
  return page(`${head}
    <div class="card"><div class="two"><label class="fld"><span>Visite A</span><select class="sel" id="cmp-a">${opts(A)}</select></label><label class="fld"><span>Visite B</span><select class="sel" id="cmp-b">${opts(B)}</select></label></div>
      ${Number.isFinite(days) ? `<p style="font-size:14px;margin:4px 0 0">${days} jour(s) entre les deux visites.</p>` : ''}</div>
    ${row('Stade observé', 'stade')}${row('Observations', 'observations')}${row('Problèmes constatés', 'problemes')}${row('Interventions', 'interventions')}${row('Recommandations', 'recommandations')}
    <div class="card"><h3>Photos et conseils joints</h3><dl class="kv"><dt>Photos A / B</dt><dd>${(A.photos ?? []).length} / ${(B.photos ?? []).length}</dd><dt>Conseils A</dt><dd>${esc(titles(A))}</dd><dt>Conseils B</dt><dd>${esc(titles(B))}</dd></dl></div>
    <div class="card"><h3>Stades saisis, visite par visite</h3>${vs.map((v) => `<p style="font-size:14px;margin:4px 0">${esc(fmtDate(v.date))} : <b>${esc(v.stade || '—')}</b></p>`).join('')}</div>
    ${note('info', 'info', 'Cette comparaison porte sur les textes saisis. Elle ne juge pas l’évolution agronomique de la culture.')}`);
}

// Routeur par hash (compatible GitHub Pages en sous-répertoire) + bouton retour Android/navigateur
// ----------------------------------------------------------------------------------------------
let depth = 0;
const ui = { cropQuery: '', cropCat: '' };

function currentRoute() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, query = ''] = raw.split('?');
  return { path: path.replace(/\/+$/, '') || '/', params: new URLSearchParams(query) };
}
function go(to) {
  history.pushState({ d: depth + 1 }, '', `#${to}`);
  depth += 1;
  render(true);
}
function replace(to) {
  history.replaceState({ d: depth }, '', `#${to}`);
  render(false);
}
function parentOf(path) {
  const p = path.split('/').filter(Boolean);
  if (p.length === 0) return '/';
  if (p[0] === 'activites') {
    if (p[1] === 'parcelles') return '/activites/exploitations';
    if (p[1] === 'visites') return '/activites/historique';
    return p.length > 2 ? `/activites/${p[1]}` : '/activites';
  }
  if (p[0] === 'conseiller' && CALCS[p[1]] !== undefined || (p[0] === 'conseiller' && p[1] === 'itineraires')) {
    const f = AG?.FUNCTIONS.find((x) => x.live && (x.route === `/conseiller/${p[1]}` || x.id === p[1].replace(/-(ref|plan)$/, '')));
    return f ? `/conseiller/cat/${f.cat}` : '/conseiller';
  }
  if (p[0] === 'conseiller' && p[1] === 'fn') {
    const fn = AG?.getFunction(p[2]);
    return fn ? `/conseiller/cat/${fn.cat}` : '/conseiller';
  }
  if (p[0] === 'conseiller' && p[1] === 'culture') return '/conseiller/cultures';
  if (p[0] === 'conseiller' && p[1] === 'cultures') return '/conseiller/cat/cultures';
  if (p[0] === 'conseiller' && p[1] === 'cat') return '/conseiller';
  if (p.length > 1) return `/${p[0]}`;
  return '/';
}
function back() {
  if (depth > 0) history.back();
  else replace(parentOf(currentRoute().path));
}
window.addEventListener('popstate', (e) => { depth = e.state?.d ?? 0; render(true); });

// ----------------------------------------------------------------------------------------------
// Mes activités (v0.2.0)
// ----------------------------------------------------------------------------------------------
const notFound = (what) => page(`<h1>${esc(what)} introuvable</h1>${note('err', 'warn', 'Cet élément n’existe plus (il a peut-être été supprimé).')}`);
const delBtn = (store, id, to) => `<button class="btn danger" type="button" data-act="del" data-store="${store}" data-id="${esc(id)}" data-to="${esc(to)}">${ic('trash')} Supprimer</button>`;
const submitBtn = (label = 'Enregistrer') => `<button class="btn" type="submit">${ic('check')} ${esc(label)}</button>`;
const visitRow = (v) => rowBtn({ to: `/activites/visites/${v.id}`, icon: 'visit', title: `${fmtDate(v.date)} — ${v.producteurNom || 'Producteur'}`,
  sub: [v.parcelleNom, v.cultureNom, v.stade].filter(Boolean).join(' · ') || 'Visite sans détail' });

async function viewActivites() {
  const c = {}; for (const s of STORES) c[s] = (await dbAll(s)).length;
  const routes = { producteurs: '/activites/producteurs', exploitations: '/activites/exploitations', visite: '/activites/visite', suivi: '/activites/suivi', historique: '/activites/historique' };
  const sub = { producteurs: `${c.producteurs} producteur(s) enregistré(s)`, exploitations: `${c.exploitations} exploitation(s) · ${c.parcelles} parcelle(s)`,
    visite: 'Enregistrer une visite de terrain en 3 étapes', suivi: 'Prochaines visites, interventions, recommandations', historique: `${c.visites} visite(s) enregistrée(s)` };
  return page(`
    <span class="eyebrow">Espace de travail</span>
    <h1>Mes activités</h1>
    <p class="lead">L’espace de travail quotidien du conseiller.</p>
    ${note('info', 'info', 'Les données sont enregistrées <b>sur ce téléphone</b>, sans connexion. Pensez à les sauvegarder régulièrement : <b>Accueil → À propos → Sauvegarde</b>.')}
    ${SECTIONS.map((s) => rowBtn({ to: routes[s.id], icon: s.icon, title: s.label, sub: sub[s.id] })).join('')}
  `);
}

// ---- Producteurs
async function viewProducteurs() {
  const list = (await dbAll('producteurs')).sort(byName);
  return page(`
    <span class="eyebrow">Mes activités</span><h1>Producteurs</h1>
    <button class="btn" type="button" data-go="/activites/producteurs/nouveau">${ic('plus')} Ajouter un producteur</button>
    ${list.length ? list.map((p) => rowBtn({ to: `/activites/producteurs/${p.id}`, icon: 'users', title: p.nom, sub: [p.localite, p.telephone].filter(Boolean).join(' · ') || 'Aucun détail' })).join('')
      : '<div class="empty">Aucun producteur enregistré pour l’instant.</div>'}
  `);
}
async function viewProducteurForm(id) {
  const old = id ? await dbGet('producteurs', id) : null;
  if (id && !old) return notFound('Producteur');
  return page(`
    <span class="eyebrow">Producteurs</span><h1>${old ? 'Modifier le dossier' : 'Nouveau producteur'}</h1>
    <form class="form" data-form="producteur" data-id="${esc(id)}">
      ${fld('Nom et prénoms', 'nom', old?.nom, { req: true })}
      ${fld('Téléphone', 'telephone', old?.telephone, { type: 'tel', attrs: 'inputmode="tel"' })}
      ${fld('Village / localité', 'localite', old?.localite)}
      ${fld('Groupement ou coopérative', 'groupement', old?.groupement)}
      ${fld('Notes', 'notes', old?.notes, { area: true })}
      ${submitBtn()}
    </form>`);
}
async function viewProducteur(id) {
  const p = await dbGet('producteurs', id); if (!p) return notFound('Producteur');
  const rap = await dbGet('reglages', 'rapport').catch(() => null);
  const exps = (await dbAll('exploitations')).filter((e) => e.producteurId === id).sort(byName);
  const visits = (await dbAll('visites')).filter((v) => v.producteurId === id).sort(byDateDesc);
  return page(`
    <span class="eyebrow">Producteur</span><h1>${esc(p.nom)}</h1>
    <div class="card"><dl class="kv"><dt>Téléphone</dt><dd>${esc(p.telephone || '—')}</dd><dt>Localité</dt><dd>${esc(p.localite || '—')}</dd><dt>Groupement</dt><dd>${esc(p.groupement || '—')}</dd></dl>
      ${p.notes ? `<p style="font-size:14px">${esc(p.notes)}</p>` : ''}</div>
    <div class="actions"><button class="btn alt" type="button" data-go="/activites/producteurs/${esc(id)}/modifier">${ic('edit')} Modifier</button>
      <button class="btn" type="button" data-act="visit-for" data-p="${esc(id)}">${ic('visit')} Nouvelle visite</button></div>
    <div class="card"><h3>Exploitations (${exps.length})</h3>
      ${exps.map((e) => `<button class="mini" type="button" data-go="/activites/exploitations/${esc(e.id)}">${ic('plots')}<span>${esc(e.nom)}</span>${ic('chev')}</button>`).join('') || '<p style="font-size:14px;color:var(--ink-2)">Aucune exploitation.</p>'}
      <p><button class="btn alt sm" type="button" data-go="/activites/exploitations/nouvelle?producteur=${esc(id)}">${ic('plus')} Ajouter une exploitation</button></p></div>
    <div class="card"><h3>Historique des visites (${visits.length})</h3>
      ${visits.slice(0, 10).map((v) => `<button class="mini" type="button" data-go="/activites/visites/${esc(v.id)}">${ic('visit')}<span>${esc(fmtDate(v.date))} · ${esc([v.parcelleNom, v.cultureNom].filter(Boolean).join(' · ') || 'Visite')}</span>${ic('chev')}</button>`).join('') || '<p style="font-size:14px;color:var(--ink-2)">Aucune visite.</p>'}</div>
    ${pdfSynthForm('producteur', id, rap)}
    ${delBtn('producteurs', id, '/activites/producteurs')}
  `);
}

// ---- Exploitations
async function viewExploitations() {
  const [list, prods, pars] = await Promise.all([dbAll('exploitations'), dbAll('producteurs'), dbAll('parcelles')]);
  const pn = Object.fromEntries(prods.map((p) => [p.id, p.nom]));
  list.sort(byName);
  return page(`
    <span class="eyebrow">Mes activités</span><h1>Exploitations et parcelles</h1>
    ${prods.length ? `<button class="btn" type="button" data-go="/activites/exploitations/nouvelle">${ic('plus')} Créer une exploitation</button>`
      : note('warn', 'info', 'Ajoutez d’abord un producteur : chaque exploitation lui est rattachée.')}
    ${list.length ? list.map((e) => rowBtn({ to: `/activites/exploitations/${e.id}`, icon: 'plots', title: e.nom, sub: `${pn[e.producteurId] ?? 'Producteur supprimé'} · ${pars.filter((x) => x.exploitationId === e.id).length} parcelle(s)` })).join('')
      : '<div class="empty">Aucune exploitation enregistrée.</div>'}
  `);
}
async function viewExploitationForm(id, q) {
  const old = id ? await dbGet('exploitations', id) : null;
  if (id && !old) return notFound('Exploitation');
  const prods = (await dbAll('producteurs')).sort(byName);
  if (!prods.length) return page(`<h1>Exploitation</h1>${note('warn', 'info', 'Ajoutez d’abord un producteur.')}`);
  const pid = old?.producteurId ?? q.get('producteur') ?? '';
  return page(`
    <span class="eyebrow">Exploitations</span><h1>${old ? 'Modifier l’exploitation' : 'Nouvelle exploitation'}</h1>
    <form class="form" data-form="exploitation" data-id="${esc(id)}">
      ${selFld('Producteur', 'producteurId', prods.map((p) => [p.id, p.nom]), pid, { req: true })}
      ${fld('Nom de l’exploitation', 'nom', old?.nom, { req: true, ph: 'Ex. Exploitation de Kpalimé' })}
      ${(() => { const src = old ?? CTX; const lv = GENERIC_LEVELS; return `${selFld('Pays', 'pays', countryOptions(), src.pays ?? '', { empty: 'Non précisé' })}
      ${fld('Si autre pays, précisez', 'paysAutre', src.paysAutre ?? '')}
      ${fld(lv[0], 'region', src.region ?? '')}${fld(lv[1], 'prefecture', src.prefecture ?? '')}${fld(lv[2], 'localite', old ? old.localite : CTX.localite)}`; })()}
      ${old ? '' : note('info', 'info', 'Pays, région et localité sont préremplis depuis vos paramètres ; modifiez-les si cette exploitation est ailleurs.')}
      ${fld('Notes', 'notes', old?.notes, { area: true })}
      ${submitBtn()}
    </form>`);
}
async function viewExploitation(id) {
  const e = await dbGet('exploitations', id); if (!e) return notFound('Exploitation');
  const rap = await dbGet('reglages', 'rapport').catch(() => null);
  const p = await dbGet('producteurs', e.producteurId);
  const pars = (await dbAll('parcelles')).filter((x) => x.exploitationId === id).sort(byName);
  const total = pars.reduce((s, x) => s + (Number(x.superficie) || 0), 0);
  return page(`
    <span class="eyebrow">Exploitation</span><h1>${esc(e.nom)}</h1>
    <div class="card"><dl class="kv"><dt>Producteur</dt><dd>${esc(p?.nom ?? 'Supprimé')}</dd><dt>Pays</dt><dd>${esc(paysLabel(e) || '—')}</dd><dt>Région</dt><dd>${esc(e.region || '—')}</dd><dt>Préfecture / district</dt><dd>${esc(e.prefecture || '—')}</dd><dt>Localité</dt><dd>${esc(e.localite || '—')}</dd>
      <dt>Parcelles</dt><dd>${pars.length}</dd><dt>Superficie renseignée</dt><dd>${total ? `${Math.round(total * 1000) / 1000} ha` : '—'}</dd></dl>
      ${e.notes ? `<p style="font-size:14px">${esc(e.notes)}</p>` : ''}</div>

// ---- Nouvelle visite (assistant en 3 étapes)
async function viewVisite() {
  await enginePromise;
  const [prods, exps, pars] = await Promise.all([dbAll('producteurs'), dbAll('exploitations'), dbAll('parcelles')]);
  const d = draft;
  if (!prods.length) return page(`<span class="eyebrow">Mes activités</span><h1>Nouvelle visite</h1>${note('warn', 'info', 'Ajoutez d’abord un producteur pour pouvoir enregistrer une visite.')}<button class="btn" type="button" data-go="/activites/producteurs/nouveau">${ic('plus')} Ajouter un producteur</button>`);
  const titles = ['Producteur et parcelle', 'Culture et stade', 'Observations et suivi'];
  let body = '';
  if (d.step === 1) {
    const ex = exps.filter((e) => e.producteurId === d.producteurId).sort(byName);
    const pa = pars.filter((x) => x.exploitationId === d.exploitationId).sort(byName);
    body = selFld('Producteur', 'producteurId', prods.sort(byName).map((p) => [p.id, p.nom]), d.producteurId, { req: true })
      + (d.producteurId ? selFld('Exploitation (facultatif)', 'exploitationId', ex.map((e) => [e.id, e.nom]), d.exploitationId, { empty: ex.length ? 'Aucune / non précisée' : 'Aucune exploitation enregistrée' }) : '')
      + (d.exploitationId ? selFld('Parcelle (facultatif)', 'parcelleId', pa.map((x) => [x.id, x.nom]), d.parcelleId, { empty: pa.length ? 'Aucune / non précisée' : 'Aucune parcelle enregistrée' }) : '')
      + `<p><button class="btn alt sm" type="button" data-act="reset-draft">Effacer le formulaire</button></p>`;
  } else if (d.step === 2) {
    body = fld('Date de la visite', 'date', d.date, { type: 'date', req: true })
      + fld('Objectif de la visite (facultatif)', 'objectif', d.objectif, { ph: 'Ex. suivi de la levée, diagnostic, conseil de fertilisation…' })
      + fld('Culture', 'cultureNom', d.cultureNom, { attrs: 'list="crops-dl" autocomplete="off"', ph: 'Tapez pour chercher une culture' }) + cropsDatalist()
      + fld('Stade de développement observé', 'stade', d.stade, { ph: 'Ex. levée, floraison, maturité…' })
      + fld('Date de semis (facultatif)', 'dateSemis', d.dateSemis, { type: 'date' })
      + (AG ? selFld('Stade observé (facultatif)', 'stadeId', AG.stageIds().map((s) => [s, AG.STAGE_LABELS[s] ?? s]), d.stadeId, { empty: 'Non précisé' }) + regionSel('region', d.region) : '')
      + note('info', 'info', 'Date de semis, stade de la liste et région permettent de contrôler la cohérence du stade depuis la fiche de la visite.');
  } else {
    body = fld('Observations', 'observations', d.observations, { area: true, rows: 4, ph: 'Ce que vous constatez sur la parcelle' })
      + fld('Problèmes constatés', 'problemes', d.problemes, { area: true, ph: 'Symptômes, ravageurs, maladies, manque d’eau…' })
      + fld('Interventions réalisées ou proposées', 'interventions', d.interventions, { area: true })
      + fld('Recommandations du conseiller', 'recommandations', d.recommandations, { area: true })
      + fld('Prochaine visite (facultatif)', 'prochaineVisite', d.prochaineVisite, { type: 'date' })
      + `<div class="card"><h3>Photos (${d.photos.length}/${MAX_PHOTOS})</h3>${galleryHtml(d.photos, 'draft')}${photoPicker()}</div>`
      + note('info', 'info', 'Le diagnostic et le conseil se joignent depuis la fiche de la visite, une fois celle-ci enregistrée.');
  }
  return page(`
    <span class="eyebrow">Mes activités</span><h1>Nouvelle visite</h1>
    <div class="stepper">${[1, 2, 3].map((n) => `<i class="${n < d.step ? 'done' : n === d.step ? 'on' : ''}">${n}</i>`).join('<b></b>')}</div>
    <p class="lead"><b>Étape ${d.step}/3</b> — ${titles[d.step - 1]}</p>
    <form class="form" data-form="visite">
      ${body}
      <div class="actions">
        ${d.step > 1 ? `<button class="btn alt" type="button" data-act="step" data-n="${d.step - 1}">Précédent</button>` : ''}
        ${d.step < 3 ? `<button class="btn" type="button" data-act="step" data-n="${d.step + 1}">Suivant</button>` : submitBtn('Enregistrer la visite')}
      </div>
    </form>`);
}

async function makePdf(form) {
  const f = Object.fromEntries(new FormData(form).entries()), kind = form.dataset.kind, out = form.querySelector('.pdf-out'), btn = form.querySelector('button[type=submit]');
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = 'Création du PDF…'; out.innerHTML = '';
  try {
    await enginePromise;
    const auteur = String(f.auteur ?? '').trim(); await dbPut('reglages', { id: 'rapport', auteur, updatedAt: nowIso() });
    let res;
    if (kind === 'visit') {
      const v = await dbGet('visites', form.dataset.id); if (!v) throw new Error('Visite introuvable.');
      res = await buildVisitPdf(v, { auteur, photos: !!f.photos });
    } else if (kind === 'parcelle') {
      const pa = await dbGet('parcelles', form.dataset.id); if (!pa) throw new Error('Parcelle introuvable.');
      const e = await dbGet('exploitations', pa.exploitationId), pr = e?.producteurId ? await dbGet('producteurs', e.producteurId) : null;
      const all = await dbAll('visites');
      res = await buildActivitiesPdf({ parcelle: pa, exploitation: e, producteur: pr, visits: all.filter((v) => v.parcelleId === pa.id), upcoming: all.filter((v) => v.parcelleId === pa.id), detail: true, auteur });
    } else if (kind === 'producteur' || kind === 'exploitation') {
      const all = await dbAll('visites'), allExp = await dbAll('exploitations'), allPar = await dbAll('parcelles');
      let pr, ex = null, exps, pars, vs;
      if (kind === 'exploitation') {
        ex = await dbGet('exploitations', form.dataset.id); if (!ex) throw new Error('Exploitation introuvable.');
        pr = ex.producteurId ? await dbGet('producteurs', ex.producteurId) : null; exps = [ex];
        pars = allPar.filter((p) => p.exploitationId === ex.id); const ids = new Set(pars.map((p) => p.id));
        vs = all.filter((v) => v.exploitationId === ex.id || ids.has(v.parcelleId));
      } else {
        pr = await dbGet('producteurs', form.dataset.id); if (!pr) throw new Error('Producteur introuvable.');
        exps = allExp.filter((e) => e.producteurId === pr.id); const eids = new Set(exps.map((e) => e.id));
        pars = allPar.filter((p) => eids.has(p.exploitationId)); const pids = new Set(pars.map((p) => p.id));
        vs = all.filter((v) => v.producteurId === pr.id || eids.has(v.exploitationId) || pids.has(v.parcelleId));
      }
      res = await buildSynthesisPdf({ producteur: pr, exploitation: ex, exploitations: exps, parcelles: pars, visits: vs, detail: !!f.detail, auteur });
    } else {
      if (!f.from || !f.to || f.from > f.to) throw new Error('Vérifiez la période : la date de début doit précéder la date de fin.');
      const all = await dbAll('visites'), pr = f.producteurId ? await dbGet('producteurs', f.producteurId) : null;
      const vs = all.filter((v) => v.date >= f.from && v.date <= f.to && (!f.producteurId || v.producteurId === f.producteurId));
      res = await buildActivitiesPdf({ visits: vs, from: f.from, to: f.to, producteur: pr, upcoming: all.filter((v) => v.prochaineVisite && (!f.producteurId || v.producteurId === f.producteurId)), detail: !!f.detail, auteur });
    }
    lastPdf = res; out.innerHTML = pdfResultCard(res); startPdfPreview(res, out);
  } catch (err) { console.error(err); out.innerHTML = note('err', 'warn', esc(err.message || 'Création du PDF impossible.')); }
  finally { btn.disabled = false; btn.innerHTML = label; }
}

const fmtNum = (n) => (Number.isInteger(n) ? n : Math.round(n * 100) / 100).toLocaleString('fr-FR', { useGrouping: Math.abs(n) >= 10000 });
const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const fmtMD = (s) => { const [m, d] = String(s).split('-').map(Number); return m && d ? `${d} ${MONTHS[m - 1]}` : String(s); };
const fmtRange = (a, b) => (a === b ? fmtDate(a) : `${fmtDate(a)} → ${fmtDate(b)}`);
const SITUATIONS = { excedent: 'Excédent', deficit: 'Déficit', equilibre: 'Équilibre' };
const fmtPlain = (x, unit) => {
  const u = unit ? ` ${String(unit).replace(/m2/g, 'm²').replace(/m3/g, 'm³')}` : '';
  if (typeof x === 'number') return `${fmtNum(x)}${u}`;
  if (typeof x === 'boolean') return x ? 'Oui' : 'Non';
  if (typeof x === 'string' && SITUATIONS[x]) return SITUATIONS[x];
  if (Array.isArray(x) && x.length === 2 && x.every((n) => typeof n === 'number')) return `${fmtNum(x[0])} – ${fmtNum(x[1])}${u}`;
  if (x && typeof x === 'object' && 'from' in x && 'to' in x) return /^\d{4}-/.test(x.from) ? fmtRange(x.from, x.to) : `${fmtMD(x.from)} → ${fmtMD(x.to)}`;
  return String(x);
};

}

    let shown;

    else if (k === 'stage') shown = d.value ? esc(AG.STAGE_LABELS[d.value] ?? d.value) : 'Hors des plages du référentiel';

  }).join('');
  const chips = [res.status ? `<span class="chip plan">${esc(res.status)}</span>` : '', res.confidence ? `<span class="chip grey">Confiance : ${esc(res.confidence)}</span>` : ''].join('');

}

function genericHtml(x) {
  if (x === null || x === undefined) return '—';
  if (Array.isArray(x)) {
    if (!x.length) return '—';
    if (x.every((i) => i === null || typeof i !== 'object')) return esc(x.map((i) => (typeof i === 'number' ? fmtNum(i) : i)).join(' ; '));
    return x.map((i) => `<div class="sub-item">${genericHtml(i)}</div>`).join('');
  }
  if (typeof x === 'object') {
    if ('value' in x && ('unit' in x || 'kind' in x)) return esc(fmtPlain(x.value, x.unit));
    return Object.entries(x).filter(([, val]) => val !== null && val !== undefined && !(Array.isArray(val) && !val.length) && val !== '')
      .map(([k, val]) => (k === 'provenance' && val && typeof val === 'object' ? srcHtml(val) : SHARE_KEYS.includes(k) && typeof val === 'number' ? `<div class="kvline"><span>${esc(pretty(k))}</span> ${Math.round(val * 100)} %</div>` : `<div class="kvline"><span>${esc(pretty(k))}</span> ${genericHtml(val)}</div>`)).join('');
  }
  if (typeof x === 'number') return esc(fmtNum(x));
  if (typeof x === 'boolean') return x ? 'Oui' : 'Non';
  return esc(String(x));
}

      ${h.symptomes_non_expliques?.length ? `<h4>Non expliqués</h4>${bul(h.symptomes_non_expliques)}` : ''}${h.observations_a_rechercher?.length ? `<h4>À rechercher</h4>${bul(h.observations_a_rechercher)}` : ''}

      ${fld('Date de semis (facultatif)', 'sowingDate', '', { type: 'date' })}${fld('Date du jour', 'today', todayStr(), { type: 'date' })}${selFld('Stade observé (facultatif)', 'stage', AG.stageIds().map((s) => [s, AG.STAGE_LABELS[s] ?? s]), '', { empty: 'Non précisé' })}
      <div class="card"><h3>Implantation (facultatif)</h3>${nf('Écartement entre lignes (cm)', 'rowSpacing')}${nf('Écartement sur la ligne (cm)', 'inRowSpacing')}${nf('Graines par poquet', 'seedsPerHole')}${fld('Type de sol', 'soilType')}</div>` },

// ----------------------------------------------------------------------------------------------
// v0.10.0 — Assistant de rubrique : le Conseiller s'adapte au dossier (parcelle / visite) dans TOUTES les rubriques.
//  • Le dossier de travail est choisi une fois (parcelle ou visite) ; il est mémorisé pour la session seulement (pas de doublon de stockage).
//  • Chaque valeur reprise indique sa provenance : observation saisie, calcul TERRA, estimation, référence documentée, ou saisie par vous.
//  • Aucune valeur n'est inventée : une donnée absente est signalée comme « à renseigner » ; les références viennent du moteur avec leur source.
//  • Les résultats se recalculent automatiquement après chaque modification (hors connexion, sans réseau).
// ----------------------------------------------------------------------------------------------
const DOSSIER_KEY = 'terra-dossier';
const activeRef = () => { try { return JSON.parse(sessionStorage.getItem(DOSSIER_KEY) || 'null'); } catch { return null; } };
const setActiveRef = (o) => { try { if (o) sessionStorage.setItem(DOSSIER_KEY, JSON.stringify(o)); else sessionStorage.removeItem(DOSSIER_KEY); } catch { /* stockage de session indisponible : le dossier ne sera pas mémorisé */ } };
let curDossier = null; // dossier résolu pour l'écran affiché
let curFacts = {};     // données du dossier, avec provenance
let liveTimer = null;
let liveSeq = 0;
const PROV_LBL = { obs: 'Reprise du dossier', calc: 'Calcul TERRA', est: 'Estimation TERRA', ref: 'Référence documentée', user: 'Saisi par vous' };

async function resolveDossier(q) {
  let ref = null;
  if (q?.get('visit')) ref = { visitId: q.get('visit') };
  else if (q?.get('parcelle')) ref = { parcelleId: q.get('parcelle') };
  if (ref) setActiveRef(ref); else ref = activeRef();
  if (!ref) return null;
  const v = ref.visitId ? await dbGet('visites', ref.visitId) : null;
  const pid = v?.parcelleId || ref.parcelleId || '';
  const pa = pid ? await dbGet('parcelles', pid) : null;
  if (!v && !pa) { setActiveRef(null); return null; }
  const exId = pa?.exploitationId || v?.exploitationId || '';
  const ex = exId ? await dbGet('exploitations', exId) : null;
  const visits = pid ? (await dbAll('visites')).filter((x) => x.parcelleId === pid).sort(byDateDesc) : (v ? [v] : []);
  const label = v ? `visite du ${fmtDate(v.date)} (${[v.producteurNom, v.parcelleNom].filter(Boolean).join(' · ') || 'dossier'})` : `parcelle « ${pa.nom} »`;
  return { v, pa, ex, visits, pid, label };
}

// Valeurs déjà saisies dans d'autres rubriques pour ce dossier (enregistrées avec les résultats joints aux visites).
const SAVED_NAMES = { system: ['system', 'p_system'], density: ['density', 'd_density'] };
const SAVED_REUSE = ['rowSpacing', 'inRowSpacing', 'seedsPerHole', 'variety', 'system', 'soilType', 'density', 'survival', 'length', 'width', 'edge'];
const newestSnaps = (d) => d.visits.flatMap((v) => [...(v.agromind ?? [])].reverse());
function savedInput(d, canon) {
  const names = SAVED_NAMES[canon] ?? [canon];
  for (const s of newestSnaps(d)) for (const n of names) {
    const x = s.inputs?.[n];
    if (x !== undefined && x !== null && String(x).trim() !== '') return { val: String(x).trim(), label: `${s.titre}, enregistré le ${fmtDate(s.at)}` };
  }
  return null;
}
function savedResult(d, calc, key) {
  for (const s of newestSnaps(d)) if (s.calc === calc) for (const r of s.results ?? []) {
    const x = r.res?.values?.[key];
    if (x && typeof x.value === 'number' && Number.isFinite(x.value)) return { val: x.value, label: `${s.titre}, enregistré le ${fmtDate(s.at)}` };
  }
  return null;
}

function dossierFacts(d) {
  const F = {}; if (!d || !AG) return F;
  const { v, pa, ex } = d;
  const put = (k, val, t, label) => { if (F[k] || val === '' || val == null || (typeof val === 'number' && !Number.isFinite(val))) return; F[k] = { val, t, label }; };
  const pLbl = pa ? `Parcelle « ${pa.nom} »` : ''; const vLbl = v ? `Visite du ${fmtDate(v.date)}` : '';
  put('crop', v?.cultureId, 'obs', vLbl);
  put('crop', pa?.cultureNom ? matchCropId(pa.cultureNom) : '', 'obs', pLbl);
  const lastV = d.visits.find((x) => x.cultureId);
  put('crop', lastV?.cultureId, 'obs', lastV ? `Visite du ${fmtDate(lastV.date)}` : '');
  put('area_ha', pa?.superficie ?? v?.superficie, 'obs', pLbl || vLbl);
  if (F.area_ha) put('area_m2', Math.round(Number(F.area_ha.val) * 10000 * 100) / 100, 'calc', `${fmtNum(Number(F.area_ha.val))} ha × 10 000`);
  put('sowing', v?.dateSemis, 'obs', vLbl);
  put('sowing', pa?.dateSemis, 'obs', pLbl);
  put('today', v?.date, 'obs', vLbl);
  put('stage', v?.stadeId, 'obs', vLbl);
  let rid = '';
  if (v?.region) put('region', v.region, 'obs', vLbl);
  else if (ex?.region && (rid = matchEngineRegion(ex.region, ex.pays))) put('region', rid, 'obs', `Exploitation « ${ex.nom} »`);
  else if (CTX.region && (rid = matchEngineRegion(CTX.region, CTX.pays))) put('region', rid, 'obs', 'Contexte de travail (paramètres)');
  for (const c of SAVED_REUSE) { const s = savedInput(d, c); if (s) put(c, s.val, 'obs', s.label); }
  const dens = savedResult(d, 'densites', 'plants_ha'); if (dens) put('density', Math.round(dens.val), 'calc', dens.label);
  const prod = savedResult(d, 'rendements', 'production_kg'); if (prod) put('prod_kg', Math.round(prod.val * 100) / 100, 'est', prod.label);
  const cur = F.crop?.val;
  if (cur) { const prev = d.visits.find((x) => x.cultureId && x.cultureId !== cur); if (prev) put('previousCrop', prev.cultureId, 'obs', `Visite du ${fmtDate(prev.date)} (culture observée précédemment)`); }
  return F;
}

// Correspondance champ de formulaire → donnée du dossier (par sens, pas par rubrique : toutes les rubriques en profitent).
const FIELD_MAP = { crop: 'crop', p_crop: 'crop', c1: 'crop', area_ha: 'area_ha', d_area: 'area_ha', area2: 'area_ha', a_area: 'area_ha', b_area: 'area_ha', region: 'region', sowingDate: 'sowing',
  declaredStage: 'stage', stage: 'stage', rowSpacing: 'rowSpacing', inRowSpacing: 'inRowSpacing', seedsPerHole: 'seedsPerHole', variety: 'variety', system: 'system', p_system: 'system',
  soilType: 'soilType', density: 'density', d_density: 'density', previousCrop: 'previousCrop', area_m2: 'area_m2', area_m2b: 'area_m2', length: 'length', width: 'width', edge: 'edge',
  survival: 'survival', prod: 'prod_kg', exp: 'prod_kg' };

function tagField(el, t, label) {
  const box = el.closest('.fld'); if (!box) return;
  box.classList.add('pre');
  let s = box.querySelector('small.prov'); if (!s) { s = document.createElement('small'); box.appendChild(s); }
  s.className = `prov prov-${t}`; s.dataset.t = t; s.textContent = label ? `${PROV_LBL[t]} — ${label}` : PROV_LBL[t];
}
function userEdit(el) {
  const box = el.closest?.('.fld'); const s = box?.querySelector('small.prov'); if (!s) return;
  if (String(el.value ?? '').trim() === '') { s.remove(); box.classList.remove('pre'); } else tagField(el, 'user', '');
}
function setFact(form, name, fact) {
  const el = form.elements[name]; if (!el || !el.tagName || el.type === 'checkbox' || el.type === 'radio' || !fact) return false;
  if (String(el.value ?? '').trim() !== '') return false;
  const val = String(fact.val);
  if (el.tagName === 'SELECT' && ![...el.options].some((o) => o.value === val)) return false;
  el.value = val; tagField(el, fact.t, fact.label); return true;
}
function applyPrefill(pf) {
  const form = $('form[data-calc]'); if (!form || !pf) return;
  const { facts } = pf; const calc = form.dataset.calc;
  const map = { ...FIELD_MAP };
  for (const q of AG?.diagnosisForm?.() ?? []) { if (q.type === 'crop') map[q.field] = 'crop'; if (q.type === 'stage') map[q.field] = 'stage'; }
  if (calc === 'calculs') map.value = 'area_ha'; // conversions : la superficie de la parcelle (ha → m², déjà sélectionné par défaut)
  for (const [name, canon] of Object.entries(map)) setFact(form, name, facts[canon]);
  if (calc === 'rotations') { // succession : culture précédemment observée puis culture actuelle
    if (facts.previousCrop && facts.crop) { setFact(form, 'r1', facts.previousCrop); setFact(form, 'r2', facts.crop); } else setFact(form, 'r1', facts.crop);
  }
  if (facts.today && form.elements.today) { form.elements.today.value = facts.today.val; tagField(form.elements.today, 'obs', facts.today.label); }
}

// ---- Lecture du formulaire, informations manquantes
function formVals(form) {
  const f = {};
  for (const [k, v2] of new FormData(form).entries()) { if (k.endsWith('[]')) (f[k.slice(0, -2)] ??= []).push(String(v2)); else f[k] = String(v2); }
  return f;
}
const fieldLabel = (el) => (el.closest('.fld')?.querySelector('span')?.textContent ?? el.name ?? '').replace(/\s*\*\s*$/, '').trim();
const visibleEl = (el) => !el.closest('[hidden]');
const missingRequired = (form) => [...form.querySelectorAll('[required]')].filter((el) => visibleEl(el) && String(el.value ?? '').trim() === '').map(fieldLabel);
const cropOfForm = (f) => f.crop || f.p_crop || f.c1 || f.r1 || '';

// ---- Repères documentés (références du moteur, avec source) : jamais appliqués sans votre action
function techLines(crop, region, keys) {
  const out = []; if (!crop) return out;
  const it = AG.itinerary(crop, region || '');
  for (const t of it.techniques) for (const k of keys) { const txt = t.content?.[k]; if (typeof txt === 'string' && txt.trim()) out.push({ k, txt, src: t.source }); }
  return out;
}
const TECH_LBL = { semis: 'Semis', semences: 'Semences', ecartement: 'Écartements', pepiniere: 'Pépinière', demariage: 'Démariage' };
const srcShort = (p) => [p?.source, p?.year].filter(Boolean).join(', ').slice(0, 90) || 'source non renseignée';
const hintCard = (title, body, chip = '<span class="chip plan">Référence à valider</span>') => `<div class="card hintcard"><h3>${title} ${chip}</h3>${body}</div>`;
const applyBtn = (name, val, text, label) => `<button class="f" type="button" data-act="hint-apply" data-name="${esc(name)}" data-val="${esc(val)}" data-label="${esc(label)}">${esc(text)}</button>`;
const tNum = (n) => fmtNum(Math.round(n * 1000) / 1000);

function hintsHtml(calc, f) {
  if (!AG) return '';
  const E = AG.getEngine(); const d = curDossier; const fx = curFacts;
  const crop = cropOfForm(f) || fx.crop?.val || ''; const region = f.region || fx.region?.val || '';
  const parts = [];
  const techBlock = (keys) => techLines(crop, region, keys).map((l) => `<p style="font-size:14px;margin:6px 0"><b>${esc(TECH_LBL[l.k] ?? l.k)}</b> — ${esc(l.txt)}</p>${srcHtml(l.src)}`).join('');
  try {
    if (calc === 'densites' || calc === 'semences-plan') {
      let body = techBlock(calc === 'densites' ? ['ecartement'] : ['ecartement', 'semences']);
      if (calc === 'semences-plan' && crop) {
        const r = E.seeds.recommendedRate({ crop, region: region || undefined, area_ha: 1 });
        const rate = r.ok ? r.values?.rate_kg_ha : null;
        if (rate && rate.value != null) body += `<p style="font-size:14px;margin:6px 0"><b>Taux de semences documenté</b> — ${esc(fmtPlain(rate.value, rate.unit))}</p>${(r.sources ?? []).length ? `<div class="src"><b>Source :</b> ${r.sources.map(esc).join(' ; ')}</div>` : ''}`;
      }
      if (body) parts.push(hintCard(`Repères documentés${crop ? ` : ${esc(AG.listCrops().find((c) => c.id === crop)?.nom ?? '')}` : ''}`, `${body}<p style="font-size:12.5px;color:var(--ink-2)">Ces textes sont des repères : saisissez vous-même les écartements que vous retenez.</p>`));
      else if (crop) parts.push(note('warn', 'info', 'Aucun repère d’écartement sourcé n’est chargé pour cette culture : saisissez les écartements que vous retenez.'));
    }
    if (calc === 'fertilisation' && f.mode === 'dose') {
      if (!crop) parts.push(note('warn', 'info', 'Choisissez un dossier avec une culture pour afficher les doses documentées.'));
      else {
        const r = E.fertilization.recommendedProgram({ crop, region: region || undefined, system: f.p_system || undefined });
        const progs = r.ok ? (r.values?.programs ?? []) : [];
        if (progs.length) parts.push(hintCard('Doses documentées', progs.map((p) => `${(p.applications ?? []).map((a) => `<div style="padding:6px 0;border-top:1px solid var(--line)"><b>${esc(a.product)}</b> : ${esc(fmtNum(a.rate_kg_ha))} kg/ha${a.timing ? ` · ${esc(a.timing.from)}–${esc(a.timing.to)} ${esc(a.timing.basis ?? '')}` : ''}<br>${applyBtn('d_dose', a.rate_kg_ha, `Utiliser ${fmtNum(a.rate_kg_ha)} kg/ha`, `${a.product} — ${srcShort(p.provenance)}`)}</div>`).join('')}${srcHtml(p.provenance)}`).join('')));
        else parts.push(note('warn', 'info', 'Aucun programme de fertilisation documenté pour cette culture : saisissez la dose retenue.'));
      }
    }
    if (calc === 'rendements' && f.mode !== 'ecart' && crop) {
      const vars = AG.itinerary(crop, region || '').varieties;
      const m = f.variety ? vars.find((x) => normTxt(x.name) === normTxt(f.variety)) : null;
      if (m) {
        const avg = m.averageYield_t_ha, pot = m.potentialYield_t_ha;
        const btns = (Array.isArray(avg) ? [['bas', avg[0]], ['haut', avg[1]]] : avg != null ? [['', avg]] : []).map(([l, t]) => applyBtn('yph', Math.round(t * 1000), `Utiliser ${tNum(t * 1000)} kg/ha${l ? ` (${l})` : ''}`, `Rendement moyen documenté de « ${m.name} » — ${srcShort(m.provenance)}`)).join('');
        parts.push(hintCard(`Variété « ${esc(m.name)} »`, `<p style="font-size:14px;margin:6px 0">${avg != null ? `Rendement moyen documenté : <b>${esc(Array.isArray(avg) ? `${tNum(avg[0])} – ${tNum(avg[1])}` : tNum(avg))} t/ha</b>` : ''}${pot != null ? ` · potentiel : ${esc(tNum(pot))} t/ha` : ''}${m.cycleDays ? ` · cycle : ${esc(fmtPlain(m.cycleDays, 'jours'))}` : ''}</p>${btns ? `<div class="chips">${btns}</div>` : ''}${srcHtml(m.provenance)}<p style="font-size:12.5px;color:var(--ink-2)">Le rendement de référence est une hypothèse de départ : ajustez-le à votre parcelle.</p>`));
      } else if (vars.length) parts.push(hintCard('Variétés documentées', `<p style="font-size:13.5px;margin:4px 0">Touchez une variété pour la renseigner et voir son rendement de référence.</p><div class="chips">${vars.slice(0, 8).map((x) => applyBtn('variety', x.name, x.name, `Variété documentée — ${srcShort(x.provenance)}`)).join('')}</div>`, '<span class="chip ok">Référence</span>'));
    }
    if (calc === 'eau' && crop) {
      const r = E.water.requirement({ crop, region: region || undefined });
      if (r.ok && !Object.keys(r.values ?? {}).length) parts.push(note('warn', 'info', `<b>Besoin en eau :</b> ${esc((r.missing ?? [])[0]?.why ?? 'aucun référentiel chargé')}. Saisissez le besoin de la culture, issu de vos mesures ou d’une source que vous maîtrisez.`));
    }
    if (calc === 'superficies' && d?.pa?.superficie != null) parts.push(`<div class="card hintcard"><h3>Superficie enregistrée <span class="chip ok">Votre saisie</span></h3><p style="font-size:14px;margin:4px 0">Parcelle « ${esc(d.pa.nom)} » : <b>${esc(fmtNum(Number(d.pa.superficie)))} ha</b> (${esc(fmtNum(Math.round(Number(d.pa.superficie) * 10000)))} m²). Votre mesure sera comparée à cette valeur.</p></div>`);
    if (calc === 'phyto' || calc === 'diagnostic') {
      const vp = d?.v?.problemes ? d.v : d?.visits?.find((x) => x.problemes);
      if (vp) parts.push(`<div class="card hintcard"><h3>Problèmes constatés lors de la visite du ${esc(fmtDate(vp.date))} <span class="chip ok">Votre saisie</span></h3><p style="font-size:14px;white-space:pre-wrap;margin:4px 0">${esc(vp.problemes)}</p>${calc === 'phyto' ? '<p style="font-size:12.5px;color:var(--ink-2)">Indiquez la cible précise (ravageur ou maladie) pour interroger les produits documentés.</p>' : ''}</div>`);
    }
    if (calc === 'rotations' && d) {
      const seen = []; for (const x of [...d.visits].reverse()) if (x.cultureNom && !seen.some((s) => normTxt(s.n) === normTxt(x.cultureNom))) seen.push({ n: x.cultureNom, date: x.date });
      if (seen.length) parts.push(`<div class="card hintcard"><h3>Cultures observées sur cette parcelle <span class="chip ok">Vos visites</span></h3><p style="font-size:14px;margin:4px 0">${seen.map((s) => `${esc(s.n)} (${esc(fmtDate(s.date))})`).join(' → ')}</p></div>`);
    }
    if (calc === 'economie' || calc === 'comparaison') parts.push(note('info', 'info', 'Aucun montant n’est proposé automatiquement : saisissez vos coûts et prix en précisant leur origine (réel, estimation ou hypothèse). La surface et la production estimée sont reprises du dossier lorsqu’elles existent.'));
  } catch (err) { console.warn('TERRA : repères indisponibles', err); }
  return parts.join('');
}

function refreshAssist(form) {

  const lines = ['obs', 'calc', 'est', 'ref'].filter((t) => by[t]?.length).map((t) => `<b>${PROV_LBL[t]} :</b> ${esc(by[t].join(', '))}`);
  let html = '';

function waitingHtml(form, results) {
